name: Local CI
on:
  workflow_dispatch:
jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.14
        run: |
          mkdir -p /tmp/act-dock-bun
          curl -4 -fsSL --retry 3 https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip -o /tmp/act-dock-bun/bun-linux-x64-baseline.zip
          curl -4 -fsSL --retry 3 https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/SHASUMS256.txt -o /tmp/act-dock-bun/SHASUMS256.txt
          cd /tmp/act-dock-bun
          grep ' bun-linux-x64-baseline.zip$' SHASUMS256.txt | sha256sum --check
          unzip -q bun-linux-x64-baseline.zip
          echo /tmp/act-dock-bun/bun-linux-x64-baseline >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: tools/act-dock-helper/go.sum
      - name: Install workspace dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 bun install --frozen-lockfile --network-concurrency 8; then
              exit 0
            fi
            echo "Dependency installation attempt $attempt failed or timed out."
            sleep 5
          done
          exit 1
      - name: Prepare pinned desktop SDK
        run: bun scripts/prepare.ts
      - name: Check workspace
        run: bun run check
        env:
          # The deploy build prerenders natively; workerd can't serve it under x86 emulation here.
          ACT_DOCK_SKIP_PRERENDER: '1'
